app:
  name: "Gemma Dungeon"
  version: "1.0.0"
  theme: "retro"

llm:
  # Inference mode: 'local', 'cloud', or 'hybrid'
  mode: "local"

  # Local settings (Ollama)
  local_model: "gemma4:e2b"
  ollama_base_url: "http://localhost:11434"

  # Cloud settings (Used if mode is cloud or hybrid)
  cloud_provider: "vertex_ai"
  cloud_model_id: "gemma-4-26b-a4b-it-maas"
  cloud_endpoint: ""
  api_key_env_var: "GEMMA_API_KEY"

  # Sampling parameters
  temperature: 0.8
  top_p: 0.9
  top_k: 50
  max_tokens: 2048
  timeout_seconds: 60

resilience:
  # Hybrid fallback timeout (seconds before falling back to local provider)
  hybrid_fallback_timeout: 5.0
  # Number of consecutive cloud failures before switching off cloud for the session
  circuit_breaker_threshold: 3
  # Maximum automatic retries for malformed JSON responses
  max_parse_retries: 1

context:
  # Turns between automatic summary refinement
  summary_refinement_turn_interval: 5
  # Character count threshold triggering summary refinement
  summary_refinement_char_threshold: 200
  # Warning threshold ratio of context window (4096 tokens)
  context_window_warning_ratio: 0.8
  # Maximum active NPCs retained in state
  max_active_npcs: 10
  # Number of turns dead or inactive NPCs remain before pruning
  npc_prune_turn_threshold: 10

visualizer:
  # Enable scene illustration panel in TUI
  enabled: true
  # Backend: 'auto', 'vertex_ai' (uses ADC/project), or 'ai_studio'
  backend: "auto"
  # Image generation model on Vertex AI (Google's best pro-tier image model)
  model: "gemini-3-pro-image"
  # Google Cloud Project ID (optional if set in GOOGLE_CLOUD_PROJECT env var)
  project_id: null
  # Google Cloud region (global endpoint routes closest to user e.g. US East)
  location: "global"
  # Visual style: 'pixel_art' (24-bit TrueColor ANSI half-blocks), 'ascii', or 'monochrome'
  style: "pixel_art"
  # Target dimensions in characters (76x22 fills standard 80-col terminal edge-to-edge)
  width: 76
  height: 22
  # Local disk cache directory for generated scenes
  cache_dir: "data/cache/scenes"

